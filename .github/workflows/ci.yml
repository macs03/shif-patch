name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Confirm this job has no backend credentials
        run: |
          if [ -n "$SUPABASE_URL" ] || [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || [ -n "$DB_PASSWORD" ]; then
            echo "Quality job must not receive backend credentials"
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --selectProjects unit --selectProjects ui --runInBand
      - name: Production build without backend credentials
        run: npm run build
